---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

{% include head.html %}

{% if site.google_analytics %}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

<body>
  <main>
    {% include anchor_headings.html html=content anchorBody="#" %}
  </main>

  <footer class="social-footer">
    <div class="social-footer-icons">
      <a href="https://github.com/coder7eeN" title="Welcome to my github profile " target="_blank"
        rel="noopener noreferrer"><i class="fa fa-github" aria-hidden="true"></i></a>
      <a href="{{ "/rss.xml" | relative_url }}" title="Feed RSS" target="_blank" rel="noopener noreferrer"><i
          class="fa fa-rss" aria-hidden="true"></i></a>
    </div>
    <div class="footer-signature">
      <p> © 2021 - present, Huy Pham</p>
    </div>
  </footer>

  <script>
    function applyTheme(theme, persist) {
      var themeToggle = document.getElementById("theme-toggle");

      if (theme === "dark") {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (themeToggle) {
          themeToggle.classList.add('sun');
          themeToggle.classList.remove('moon');
        }
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        if (themeToggle) {
          themeToggle.classList.add('moon');
          themeToggle.classList.remove('sun');
        }
      }

      if (persist) {
        window.localStorage.setItem('theme', theme);
      }
    }

    var savedTheme = window.localStorage.getItem('theme');
    var systemTheme = window.matchMedia ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : '{{ site.data-theme | default: "dark" }}';
    var theme = savedTheme || systemTheme || '{{ site.data-theme | default: "dark" }}';

    applyTheme(theme, false);

    function modeSwitcher() {
      var currentMode = document.documentElement.getAttribute('data-theme');

      if (currentMode === "dark") {
        applyTheme('light', true);
      } else {
        applyTheme('dark', true);
      }
    }
  </script>
  
  <script src="https://unpkg.com/vanilla-back-to-top@7.2.1/dist/vanilla-back-to-top.min.js"></script>
  <script>addBackToTop({
    diameter: 40,
    backgroundColor: 'rgb(244, 167, 187)',
    textColor: '#000'
    })
  </script>

  {% if page.url == '/' %}
  <script src="{{ "/assets/js/simple-jekyll-search.js" | relative_url }}"></script>
  <script>
    var sjs = SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ "/search.json" | relative_url }}',
      searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}</a></li>',
      noResultsText: 'Không có kết quả.',
      limit: 10,
      fuzzy: true,
    })
  </script>
  {% endif %}

</body>

</html>
